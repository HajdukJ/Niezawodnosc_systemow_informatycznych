name: Tests
on:
  push:
  pull_request:

jobs:
  testy-p2:
    name: P2 - testy strukturalne i mutacyjne
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja narzedzi
        run: python -m pip install pytest pytest-cov coverage

      - name: Uruchomienie testow P2
        env:
          COVERAGE_FILE: coverage-p2
        run: |
          python -m pytest -v \
            --cov=zespol_C \
            --cov-branch \
            --cov-report=term-missing \
            wywolania_P2_test.py

      - name: Zapisanie danych pokrycia P2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-p2
          path: coverage-p2
          if-no-files-found: error

  testy-funkcjonalne-p3:
    name: P3 - testy funkcjonalne
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja narzedzi
        run: python -m pip install pytest pytest-cov coverage

      - name: Uruchomienie testow funkcjonalnych P3
        env:
          COVERAGE_FILE: coverage-funkcjonalne
        run: |
          python -m pytest -v \
            --cov=zespol_C \
            --cov-branch \
            --cov-report=term-missing \
            wywolania_P4_test.py

      - name: Zapisanie danych pokrycia funkcjonalnego
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-funkcjonalne
          path: coverage-funkcjonalne
          if-no-files-found: error

  testy-niefunkcjonalne-p3:
    name: P3 - testy niefunkcjonalne
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja narzedzi
        run: python -m pip install pytest pytest-cov coverage

      - name: Uruchomienie testow niefunkcjonalnych P3
        env:
          COVERAGE_FILE: coverage-niefunkcjonalne
        run: |
          python -m pytest -v -s \
            --cov=zespol_C \
            --cov-branch \
            --cov-report=term-missing \
            wywolania_P5_test.py

      - name: Zapisanie danych pokrycia niefunkcjonalnego
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-niefunkcjonalne
          path: coverage-niefunkcjonalne
          if-no-files-found: error